<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShadowDark Character Tracker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #e9e9e9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Load or Paste Level 0 Character Data</h1>
    <h4>Get your Randomized Level 0 character from <a href="https://shadowdarklings.net/create">ShadowDarklings</a>. </h4>
    
    <!-- New: File Load Input -->
    <div>
        <label for="fileLoad"><strong>Load from file:</strong></label>
        <input type="file" id="fileLoad" accept=".json">
    </div>
    <br>

    <textarea id="jsonInput" rows="10" cols="50" placeholder='Paste JSON here...'></textarea>
    <br>
    <button id="submitBtn">Render Character</button>
    <p id="errorMessage" style="color: red; display: none;">Invalid JSON. Please check your formatting.</p>

    <script>
        // 1. Handle File Loading
        document.getElementById('fileLoad').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            // When the file is done reading, dump its contents into the textarea
            reader.onload = function(e) {
                document.getElementById('jsonInput').value = e.target.result;
            };
            
            // Read the file as standard text
            reader.readAsText(file);
        });

        // 2. Handle Submission (Same as before)
        document.getElementById('submitBtn').addEventListener('click', function() {
            const inputField = document.getElementById('jsonInput');
            const errorMsg = document.getElementById('errorMessage');
            const rawData = inputField.value;

            try {
                JSON.parse(rawData); // Validate
                sessionStorage.setItem('userJsonData', rawData); // Save
                window.location.href = 'display.html'; // Redirect
            } catch (error) {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
